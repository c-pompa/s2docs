# A pyproject for tests/test_pr_delta.py: ranges in shapes a hand-typed comment gets wrong (spaces,
# exclusions, extras, markers, single quotes inside), which pr_delta.py must echo byte-for-byte.
[project]
name = "planted"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.1,<0.144",
    "mcp[cli]>=2.0.0,<3",
    "pydantic >= 2.12.0, != 2.12.3, < 3",
    "uvicorn[standard]>=0.31.1,<0.55; python_version >= '3.11'",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]  # not a runtime dependency: must not appear in the delta
